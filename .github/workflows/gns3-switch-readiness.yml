name: GNS3 switch readiness

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gns3-core-topology
  cancel-in-progress: false

jobs:
  switch-readiness:
    runs-on: [self-hosted, Windows, X64, gns-lab]
    timeout-minutes: 5
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check GNS3 VM and IOSvL2 templates
        run: ./scripts/Test-SwitchReadiness.ps1
      - name: Save switch readiness evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: switch-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/switch-readiness/readiness.json
          if-no-files-found: warn
          retention-days: 7
