name: GNS3 switching pilot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview or create the isolated switching pilot
        type: choice
        options: [plan, apply]
        default: plan
      switch_template_id:
        description: Eligible template UUID when more than one passes readiness
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: gns3-core-topology
  cancel-in-progress: false

jobs:
  switching-pilot:
    runs-on: [self-hosted, Windows, X64, gns-lab]
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Plan or provision switching pilot
        env:
          PILOT_MODE: ${{ inputs.mode }}
          SWITCH_TEMPLATE_ID: ${{ inputs.switch_template_id }}
        run: |
          $options = @{ Mode = $env:PILOT_MODE }
          if ($env:SWITCH_TEMPLATE_ID) { $options.SwitchTemplateId = $env:SWITCH_TEMPLATE_ID }
          ./scripts/Deploy-SwitchingPilot.ps1 @options
      - name: Save switching pilot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: switching-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/switching-pilot/
          if-no-files-found: warn
          retention-days: 7
