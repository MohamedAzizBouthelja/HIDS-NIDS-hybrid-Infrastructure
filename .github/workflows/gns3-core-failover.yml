name: GNS3 core failover

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Apply briefly shuts R1 FastEthernet0/0 and restores it
        type: choice
        options: [plan, apply]
        default: plan
      capture_traceroute:
        description: Capture bounded traceroutes during baseline, backup and recovery
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: gns3-core-topology
  cancel-in-progress: false

jobs:
  core-failover:
    runs-on: [self-hosted, Windows, X64, gns-lab]
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test failover and restoration logic
        run: ./tests/Test-CoreFailover.ps1
      - name: Plan or exercise primary link failure
        env:
          FAILOVER_MODE: ${{ inputs.mode }}
          CAPTURE_TRACEROUTE: ${{ inputs.capture_traceroute }}
        run: ./scripts/Test-CoreFailover.ps1 -Mode $env:FAILOVER_MODE -CaptureTraceroute:($env:CAPTURE_TRACEROUTE -eq 'true')
      - name: Save failover evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: core-failover-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/failover/
          if-no-files-found: warn
          retention-days: 7
