name: GNS3 routed server VLAN

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Check integration wiring and settings or configure and test routed VLAN 20
        type: choice
        options: [plan, apply]
        default: plan
      project_name:
        description: Exact name of the open integration copy
        type: string
        default: Hybrid-Core-Integration

permissions:
  contents: read

concurrency:
  group: gns3-core-topology
  cancel-in-progress: false

jobs:
  server-vlan:
    runs-on: [self-hosted, Windows, X64, gns-lab]
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check or configure the R4 server LAN
        env:
          SERVER_MODE: ${{ inputs.mode }}
          INTEGRATION_PROJECT: ${{ inputs.project_name }}
        run: ./scripts/Configure-ServerVlan.ps1 -Mode $env:SERVER_MODE -ProjectName $env:INTEGRATION_PROJECT
      - name: Save routed VLAN evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: server-vlan-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/server-vlan/
          if-no-files-found: warn
          retention-days: 7
