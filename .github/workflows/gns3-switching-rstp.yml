name: GNS3 switching RSTP

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Check pilot wiring or interrupt and restore the forwarding trunk
        type: choice
        options: [plan, apply]
        default: plan

permissions:
  contents: read

concurrency:
  group: gns3-core-topology
  cancel-in-progress: false

jobs:
  switching-rstp:
    runs-on: [self-hosted, Windows, X64, gns-lab]
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check or exercise RSTP
        env:
          RSTP_MODE: ${{ inputs.mode }}
        run: ./scripts/Test-SwitchingRstp.ps1 -Mode $env:RSTP_MODE
      - name: Save RSTP evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: switching-rstp-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/switching-rstp/
          if-no-files-found: warn
          retention-days: 7
