name: GNS3 core interfaces

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview or configure router addresses and test neighbor connectivity
        type: choice
        options: [plan, apply]
        default: plan

permissions:
  contents: read

concurrency:
  group: gns3-core-topology
  cancel-in-progress: false

jobs:
  core-interfaces:
    runs-on: [self-hosted, Windows, X64, gns-lab]
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test interface automation and Telnet decoding
        run: ./tests/Test-CoreInterfaces.ps1
      - name: Plan or configure router interfaces
        env:
          INTERFACE_MODE: ${{ inputs.mode }}
        run: ./scripts/Configure-CoreInterfaces.ps1 -Mode $env:INTERFACE_MODE -EvidenceDirectory 'artifacts/interfaces'
      - name: Save configuration and ping evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: core-interfaces-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/interfaces/
          if-no-files-found: warn
          retention-days: 7
