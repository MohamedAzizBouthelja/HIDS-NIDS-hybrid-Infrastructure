name: GNS3 core OSPF

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview or configure and verify the OSPF baseline
        type: choice
        options: [plan, apply]
        default: plan

permissions:
  contents: read

concurrency:
  group: gns3-core-topology
  cancel-in-progress: false

jobs:
  core-ospf:
    runs-on: [self-hosted, Windows, X64, gns-lab]
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test OSPF configuration and verification logic
        run: ./tests/Test-CoreOspf.ps1
      - name: Plan or configure OSPF
        env:
          OSPF_MODE: ${{ inputs.mode }}
        run: ./scripts/Configure-CoreOspf.ps1 -Mode $env:OSPF_MODE -EvidenceDirectory 'artifacts/ospf'
      - name: Save routing and connectivity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: core-ospf-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ospf/
          if-no-files-found: warn
          retention-days: 7
